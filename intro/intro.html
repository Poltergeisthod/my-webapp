<body>
<canvas id="c"></canvas>
<script>
// Text on the intro. Change these lines and re-render to make a new version.
const TEXT = {
  label: 'РЕКЛАМА',
  big: 'VPN',
  second: '+ ХОСТИНГ',
  third: 'для ТГ-ботов',
  pill: 'Ссылка в профиле'
};

const W = 1080, H = 1920, VX = 540, VY = 760, T = 3.0, TAU = Math.PI * 2;
const CYAN = '#2ee6ff', VIOLET = '#8c5bff', WHITE = '#f4f7ff';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(7);
const stars = Array.from({ length: 420 }, () => ({ a: R() * TAU, z: R(), violet: R() < 0.4, w: 1 + R() * 3 }));

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const frac = x => x - Math.floor(x);

// Distance flown through the tunnel: accelerates into the hit at 0.9 s, then cruises.
function travel(t) {
  if (t < 0.9) return 0.35 * t + 1.5 * t * t * t;
  return 0.35 * 0.9 + 1.5 * 0.729 + (t - 0.9) * 0.22;
}
function speed(t) { return t < 0.9 ? 0.35 + 4.5 * t * t : 0.22; }

const scan = document.createElement('canvas');
scan.width = 4; scan.height = 4;
const sctx = scan.getContext('2d');
sctx.fillStyle = 'rgba(0,0,0,0.16)';
sctx.fillRect(0, 0, 4, 1);
const scanPattern = ctx.createPattern(scan, 'repeat');

function background(t) {
  const g = ctx.createRadialGradient(VX, VY, 0, VX, VY, 1400);
  g.addColorStop(0, '#0d1030');
  g.addColorStop(1, '#03040a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const tr = travel(t), sp = speed(t);
  const hit = t >= 0.9;
  const warpAlpha = hit ? 0.35 : 0.5 + 0.5 * seg(t, 0, 0.8);

  // Tunnel of hexagon frames flying toward the viewer.
  for (let k = 0; k < 10; k++) {
    const z = frac(k / 10 - tr * 0.5);
    const s = 110 / (z + 0.05);
    ctx.save();
    ctx.globalAlpha = (1 - z) * (hit ? 0.18 : 0.55);
    ctx.strokeStyle = k % 2 ? VIOLET : CYAN;
    ctx.lineWidth = 2 + (1 - z) * 7;
    ctx.beginPath();
    for (let i = 0; i <= 6; i++) {
      const a = i / 6 * TAU + Math.PI / 6;
      const x = VX + Math.cos(a) * s, y = VY + Math.sin(a) * s * 1.12;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Light streaks.
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of stars) {
    const z = frac(s.z - tr);
    const r1 = 26 / (z + 0.02);
    const r2 = 26 / (z + 0.02 + 0.015 + sp * 0.02);
    if (r2 > 1600) continue;
    ctx.globalAlpha = clamp(1 - z) * warpAlpha;
    ctx.strokeStyle = s.violet ? VIOLET : CYAN;
    ctx.lineWidth = s.w * (1.2 - z);
    ctx.beginPath();
    ctx.moveTo(VX + Math.cos(s.a) * r2, VY + Math.sin(s.a) * r2);
    ctx.lineTo(VX + Math.cos(s.a) * r1, VY + Math.sin(s.a) * r1);
    ctx.stroke();
  }
  ctx.restore();
}

function shieldPath(cx, top) {
  const p = new Path2D();
  p.moveTo(cx, top);
  p.bezierCurveTo(cx + 70, top + 45, cx + 130, top + 50, cx + 165, top + 50);
  p.lineTo(cx + 165, top + 180);
  p.bezierCurveTo(cx + 165, top + 300, cx + 70, top + 350, cx, top + 380);
  p.bezierCurveTo(cx - 70, top + 350, cx - 165, top + 300, cx - 165, top + 180);
  p.lineTo(cx - 165, top + 50);
  p.bezierCurveTo(cx - 130, top + 50, cx - 70, top + 45, cx, top);
  return p;
}

function shield(t) {
  const p = easeOut(seg(t, 0.95, 1.45));
  if (p <= 0) return;
  const top = 565, path = shieldPath(VX, top), len = 1250;
  const pulse = t > 1.5 ? 0.5 + 0.5 * Math.sin((t - 1.5) * 6) : 1;
  ctx.save();
  ctx.globalAlpha = p * 0.18;
  const fill = ctx.createLinearGradient(0, top, 0, top + 380);
  fill.addColorStop(0, CYAN);
  fill.addColorStop(1, VIOLET);
  ctx.fillStyle = fill;
  ctx.fill(path);
  ctx.globalAlpha = 1;
  ctx.setLineDash([len, len]);
  ctx.lineDashOffset = len * (1 - p);
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 14;
  ctx.lineJoin = 'round';
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 30 + 20 * pulse;
  ctx.stroke(path);
  ctx.restore();

  // Keyhole.
  const k = seg(t, 1.3, 1.5);
  if (k > 0) {
    const s = 0.6 + 0.4 * easeOutBack(k);
    ctx.save();
    ctx.translate(VX, top + 175);
    ctx.scale(s, s);
    ctx.globalAlpha = k;
    ctx.fillStyle = WHITE;
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(0, -20, 38, 0, TAU);
    ctx.moveTo(-18, 0);
    ctx.lineTo(-30, 85);
    ctx.lineTo(30, 85);
    ctx.lineTo(18, 0);
    ctx.fill();
    ctx.restore();
  }
}

function bigWord(t) {
  if (t < 0.92) return;
  const x = seg(t, 0.92, 1.2);
  const s = 1.9 - 0.9 * easeOutBack(x);
  const dx = 26 * (1 - x) + (t > 1.95 && t < 2.0 ? 14 : 0);
  ctx.save();
  ctx.translate(VX, 1110);
  ctx.scale(s, s);
  ctx.font = '800 250px Unbounded, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = seg(t, 0.92, 0.97);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = CYAN;
  ctx.fillText(TEXT.big, -dx, 0);
  ctx.fillStyle = VIOLET;
  ctx.fillText(TEXT.big, dx, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 40;
  ctx.fillStyle = WHITE;
  ctx.fillText(TEXT.big, 0, 0);
  ctx.restore();
}

const GLYPHS = '#%&@$01ABXZ<>/*';
function decodeLine(t) {
  const start = 1.42;
  if (t < start) return;
  const str = TEXT.second;
  ctx.save();
  ctx.font = '800 100px Unbounded, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const total = ctx.measureText(str).width;
  const x0 = VX - total / 2;
  const frame = Math.floor(t * 30);
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === ' ') continue;
    const x = x0 + ctx.measureText(str.slice(0, i)).width;
    const done = t >= start + 0.06 + i * 0.045;
    if (done) {
      ctx.fillStyle = ch === '+' ? CYAN : WHITE;
      ctx.shadowColor = VIOLET;
      ctx.shadowBlur = 24;
      ctx.fillText(ch, x, 1290);
    } else {
      const r = mulberry32(frame * 131 + i)();
      ctx.fillStyle = VIOLET;
      ctx.shadowBlur = 0;
      ctx.fillText(GLYPHS[Math.floor(r * GLYPHS.length)], x, 1290);
    }
  }
  ctx.restore();
}

function thirdLine(t) {
  const p = easeOut(seg(t, 1.85, 2.15));
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = p;
  ctx.font = '700 76px Manrope, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#bff3ff';
  ctx.fillText(TEXT.third, VX, 1400 + (1 - p) * 50);
  ctx.restore();
}

function pill(t) {
  const p = easeOut(seg(t, 2.2, 2.45));
  if (p <= 0) return;
  ctx.save();
  ctx.font = '700 46px Manrope, sans-serif';
  const w = ctx.measureText(TEXT.pill).width + 90, h = 96;
  ctx.translate(VX, 1565);
  const s = 0.8 + 0.2 * easeOutBack(p);
  ctx.scale(s, s);
  ctx.globalAlpha = p;
  ctx.beginPath();
  ctx.roundRect(-w / 2, -h / 2, w, h, h / 2);
  ctx.fillStyle = 'rgba(46,230,255,0.12)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = CYAN;
  ctx.shadowColor = CYAN;
  ctx.shadowBlur = 20 + 15 * Math.sin(t * 9);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(TEXT.pill, 0, 3);
  ctx.restore();
}

function label(t) {
  const a = seg(t, 1.0, 1.2) * 0.55;
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '700 32px Manrope, sans-serif';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '10px';
  ctx.textAlign = 'center';
  ctx.fillStyle = WHITE;
  ctx.fillText(TEXT.label, VX, 470);
  ctx.restore();
}

function glitch(t, amount) {
  const r = mulberry32(Math.floor(t * 60) + 999);
  for (let k = 0; k < 9; k++) {
    const y = r() * H, h = 10 + r() * 70, dx = (r() * 2 - 1) * amount;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  background(t);

  // Shockwave from the hit.
  if (t >= 0.9 && t < 1.6) {
    const q = seg(t, 0.9, 1.6);
    ctx.save();
    ctx.globalAlpha = 1 - q;
    ctx.strokeStyle = CYAN;
    ctx.lineWidth = 40 * (1 - q) + 2;
    ctx.shadowColor = CYAN;
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(VX, VY, easeOut(q) * 1400, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  shield(t);
  label(t);
  bigWord(t);
  decodeLine(t);
  thirdLine(t);
  pill(t);

  if (t >= 0.9 && t < 1.12) glitch(t, 70 * (1 - seg(t, 0.9, 1.12)));
  if (t > 1.95 && t < 2.0) glitch(t, 30);
  if (t > 2.8) glitch(t, 140 * seg(t, 2.8, 3.0));

  // White flash on the hit.
  const flash = t < 0.84 ? 0 : t < 0.9 ? seg(t, 0.84, 0.9) : Math.exp(-(t - 0.9) * 7);
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.9})`;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.fillStyle = scanPattern;
  ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(VX, H / 2, 500, VX, H / 2, 1300);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  const out = seg(t, 2.88, 3.0);
  if (out > 0) {
    ctx.fillStyle = `rgba(0,0,0,${out * 0.7})`;
    ctx.fillRect(0, 0, W, H);
  }
}

window.render = render;
window.ready = Promise.all([
  document.fonts.load('800 100px Unbounded', 'VPN ХОСТИНГ'),
  document.fonts.load('700 50px Manrope', 'для ТГ-ботов')
]);

if (location.hash !== '#capture') {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop(now) {
      const t = ((now - t0) / 1000) % (T + 0.8);
      render(Math.min(t, T));
      requestAnimationFrame(loop);
    })(t0);
  });
}
</script>
</body>
</html>
