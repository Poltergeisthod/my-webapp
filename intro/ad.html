<canvas id="c"></canvas>
<script>
// Everything the ad says. Change these lines and re-render to make a new version.
const TEXT = {
  hook1: 'Выключил ПК —',
  hook2: 'и бот умер?',
  botName: 'Мой бот',
  label: 'РЕШЕНИЕ',
  title1: 'ХОСТИНГ',
  title2: 'ТГ-БОТОВ',
  big: '24/7',
  bullets: ['Дёшево', 'ПК можно выключать', 'Бот всегда на связи'],
  bonus: '+ VPN',
  bonusSub: 'тоже у нас',
  brand: '',            // название сервиса, если нужно показать
  cta: 'Ссылка в профиле'
};

const W = 1080, H = 1920, T = 7.0, TAU = Math.PI * 2;
const C = {
  bg: '#0a0f1f', card: '#121a2e', line: '#26314f', text: '#f2f5ff', muted: '#8a93b5',
  blue: '#2f6bff', botBubble: '#1e2742', green: '#3ddc84', red: '#ff4d5e', yellow: '#ffd23f', ink: '#10131f'
};
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 2.0, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function noise(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function font(size, display) {
  ctx.font = display ? `800 ${size}px Unbounded, sans-serif` : `700 ${size}px Manrope, sans-serif`;
}
// Draws text scaled down if it would be wider than maxW.
function fitText(str, x, y, maxW) {
  const w = ctx.measureText(str).width;
  if (w <= maxW) { ctx.fillText(str, x, y); return; }
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(maxW / w, maxW / w);
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

/* ---------- Icons ---------- */
function botFace(cx, cy, r, color, alive) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = C.ink;
  rr(cx - r * 0.55, cy - r * 0.35, r * 1.1, r * 0.8, r * 0.25);
  ctx.fill();
  ctx.fillStyle = alive ? '#ffffff' : C.muted;
  if (alive) {

function bubble(m, y, t) {
  const p = seg(t, m.t, m.t + 0.16);
  if (p <= 0) return;
  font(44, false);
  const tw = ctx.measureText(m.text).width;
  font(28, false);
  const timeW = m.time ? ctx.measureText(m.time).width + 22 : 0;
  const w = tw + 64 + timeW, h = 92;
  const x = m.me ? 950 - w : 130;
  const s = 0.7 + 0.3 * back(p);
  ctx.save();
  ctx.globalAlpha *= clamp(p * 3);
  ctx.translate(m.me ? x + w : x, y + h / 2);
  ctx.scale(s, s);
  ctx.translate(m.me ? -(x + w) : -x, -(y + h / 2));
  ctx.fillStyle = m.me ? C.blue : C.botBubble;
  rr(x, y, w, h, 30);
  ctx.fill();
  font(44, false);
  ctx.fillStyle = C.text;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText(m.text, x + 32, y + h / 2 + 2);
  if (m.time) {
    font(28, false);
    ctx.fillStyle = 'rgba(242,245,255,0.6)';
    ctx.fillText(m.time, x + 32 + tw + 22, y + h / 2 + 10);
  }
  if (m.fail) {
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.arc(x - 38, y + h / 2, 22, 0, TAU);
    ctx.fill();
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 41, y + h / 2 - 13, 6, 16);
    ctx.fillRect(x - 41, y + h / 2 + 7, 6, 6);
  }
  ctx.restore();
}

    const p = easeOut(seg(t, 0.1 + i * 0.045, 0.25 + i * 0.045));
    if (p <= 0) continue;
    const y = ry + i * (unitH + gap);
    const x = rx - (1 - p) * 700;

    ctx.save();
    ctx.globalAlpha = p;
    ctx.fillStyle = C.card;
    rr(x, y, rw, unitH, 12);
    ctx.fill();
    ctx.fillStyle = C.line;
    for (let k = 0; k < 10; k++) {
      if (last && k < 5) continue;
      ctx.fillRect(x + 300 + k * 36, y + 18, 16, unitH - 36);
    }
    ctx.fillStyle = noise(Math.floor(t * 8) + i * 13) > 0.35 ? C.green : '#1d4d33';
    ctx.beginPath();
    ctx.arc(x + 40, y + unitH / 2, 9, 0, TAU);
    ctx.fill();
    ctx.fillStyle = noise(Math.floor(t * 6) + i * 7 + 50) > 0.5 ? C.yellow : '#4d4120';
    ctx.beginPath();
    ctx.arc(x + 72, y + unitH / 2, 9, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  const bp = seg(t, 0.55, 0.72);
  if (bp > 0) {
    const by = ry + (n - 1) * (unitH + gap) + unitH / 2;
    botFace(rx + 135, by + 5, 17 * (0.6 + 0.4 * back(bp)), C.green, true);

/* ---------- Scene 2: the answer ---------- */
function slam(str, y, size, start, color, maxW) {
  if (seg(t_now, start, start + 0.001) <= 0) return;
  const p = seg(t_now, start, start + 0.22);
  const s = 1.7 - 0.7 * back(p);
  ctx.save();
  ctx.globalAlpha = clamp(p * 4);
  ctx.translate(W / 2, y);
  ctx.scale(s, s);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  font(size, true);
  ctx.fillStyle = color;
  fitText(str, 0, 0, maxW);
  ctx.restore();
}
let t_now = 0;

function scene2(t) {
  // Glow behind 24/7.
  const gp = seg(t, 2.6, 2.9);
  if (gp > 0) {
    const g = ctx.createRadialGradient(W / 2, 800, 0, W / 2, 800, 620);
    g.addColorStop(0, `rgba(255,210,63,${0.22 * gp})`);
    g.addColorStop(1, 'rgba(255,210,63,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  // Ring burst when 24/7 lands.
  if (t > 2.6 && t < 3.3) {
    const q = seg(t, 2.6, 3.3);
    ctx.save();
    ctx.globalAlpha = 1 - q;
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 30 * (1 - q) + 2;
    ctx.beginPath();
    ctx.arc(W / 2, 800, 150 + easeOut(q) * 900, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  const la = seg(t, 2.3, 2.45);
  if (la > 0) {
    ctx.save();
    ctx.globalAlpha = la;
    font(34, false);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '12px';
    ctx.textAlign = 'center';
    ctx.fillStyle = C.yellow;
    ctx.fillText(TEXT.label, W / 2, 300);
    ctx.restore();
  }
  slam(TEXT.title1, 410, 118, 2.3, C.text, 960);
  slam(TEXT.title2, 545, 118, 2.42, C.text, 960);

  if (t >= 2.6) {
    const p = seg(t, 2.6, 2.85);
    const pulse = t > 3 ? 1 + 0.025 * Math.sin((t - 3) * 8) : 1;
    const s = (1.8 - 0.8 * back(p)) * pulse;
    ctx.save();
    ctx.globalAlpha = clamp(p * 4);
    ctx.translate(W / 2, 800);
    ctx.scale(s, s);
    font(290, true);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,210,63,0.7)';
    ctx.shadowBlur = 50;
    ctx.fillStyle = C.yellow;
    fitText(TEXT.big, 0, 0, 980);
    ctx.restore();
  }

  if (TEXT.brand && t > 2.9) {
    ctx.save();
    ctx.globalAlpha = seg(t, 2.9, 3.1);
    font(46, false);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.text;
    ctx.fillText(TEXT.brand, W / 2, 990);
    ctx.restore();
  }

  // Bullets slide in, then slide out for the bonus.
  const out = easeInOut(seg(t, 5.0, 5.3));
  (V.bullets || TEXT.bullets).forEach((b, i) => {
    const p = easeOut(seg(t, 3.0 + i * 0.3, 3.25 + i * 0.3));
    if (p <= 0 || out >= 1) return;
    const y = 1050 + i * 130;
    const x = 120 - (1 - p) * 300 - out * 1200;
    ctx.save();
    ctx.globalAlpha = p * (1 - out);
    ctx.fillStyle = C.card;
    rr(x, y, 840, 108, 30);
    ctx.fill();
    ctx.fillStyle = C.yellow;
    ctx.beginPath();
    ctx.arc(x + 62, y + 54, 32, 0, TAU);
    ctx.fill();
    check(x + 62, y + 54, 34, C.ink, 7);
    font(52, false);
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    fitText(b, x + 120, y + 56, 690);
    ctx.restore();
  });

  // Back online.
  const on = seg(t, 3.95, 4.15);
  if (on > 0 && out < 1) {
    ctx.save();
    ctx.globalAlpha = on * (1 - out);
    font(40, false);
    const label = `${TEXT.botName} · в сети`;
    const w = ctx.measureText(label).width + 140;
    const x = W / 2 - w / 2, y = 1440;
    ctx.fillStyle = 'rgba(61,220,132,0.14)';
    rr(x, y, w, 90, 45);
    ctx.fill();
    botFace(x + 55, y + 50, 26, C.green, true);
    ctx.fillStyle = C.green;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x + 100, y + 47);
    ctx.restore();
  }

  // Bonus: VPN.
  const bp = easeOut(seg(t, 5.05, 5.35));
  if (bp > 0) {
    const x = 120 + (1 - bp) * 1000, y = 1060;
    ctx.save();
    ctx.globalAlpha = bp;
    ctx.fillStyle = C.card;
    rr(x, y, 840, 220, 40);
    ctx.fill();
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 4;
    ctx.stroke();
    shieldIcon(x + 130, y + 110, 150, C.yellow);
    font(96, true);
    ctx.fillStyle = C.text;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    fitText(TEXT.bonus, x + 250, y + 120, 560);
    font(46, false);
    ctx.fillStyle = C.muted;
    ctx.fillText(TEXT.bonusSub, x + 254, y + 178);
    ctx.restore();
  }

  // Call to action.
  const cp = seg(t, 5.6, 5.85);
  if (cp > 0) {
    const s = (0.7 + 0.3 * back(cp)) * (t > 6 ? 1 + 0.03 * Math.sin((t - 6) * 9) : 1);
    ctx.save();
    ctx.translate(W / 2, 1440);
    ctx.scale(s, s);
    ctx.globalAlpha = clamp(cp * 3);
    font(50, true);
    const w = Math.min(900, ctx.measureText(TEXT.cta).width + 120), h = 130;
    ctx.shadowColor = 'rgba(255,210,63,0.6)';
    ctx.shadowBlur = 40;
    ctx.fillStyle = C.yellow;
    rr(-w / 2, -h / 2, w, h, h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitText(TEXT.cta, 0, 4, w - 80);
    ctx.restore();

    // Bouncing arrow.
    const ay = 1580 + Math.abs(Math.sin((t - 5.6) * 6)) * 24;
    ctx.save();
    ctx.globalAlpha = clamp(cp * 3);
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(W / 2, ay - 40);
    ctx.lineTo(W / 2, ay + 20);
    ctx.moveTo(W / 2 - 30, ay - 8);
    ctx.lineTo(W / 2, ay + 22);
    ctx.lineTo(W / 2 + 30, ay - 8);
    ctx.stroke();
    ctx.restore();
  }
}

/* ---------- Frame ---------- */
function background(t) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 40; y < H; y += 60) {
    for (let x = 30; x < W; x += 60) ctx.fillRect(x, y, 3, 3);
  }
  // Red tint once the bot is down.
  const red = seg(t, OFF_T, 1.2) * (1 - seg(t, 2.0, 2.15));
  if (red > 0) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1300);
    g.addColorStop(0, 'rgba(255,77,94,0)');
    g.addColorStop(1, `rgba(255,77,94,${0.25 * red})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
}

function shakeAt(t) {
  let s = 0;
  for (const m of MSGS) if (m.fail) s += 14 * Math.max(0, 1 - (t - m.t) / 0.18) * (t >= m.t ? 1 : 0);
  s += 26 * Math.max(0, 1 - (t - OFF_T) / 0.25) * (t >= OFF_T ? 1 : 0);
  s += 30 * Math.max(0, 1 - (t - 2.6) / 0.3) * (t >= 2.6 ? 1 : 0);
  s += 16 * Math.max(0, 1 - (t - 2.3) / 0.2) * (t >= 2.3 ? 1 : 0);
  return s;
}

function render(t) {
  t_now = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  background(t);
  const s = shakeAt(t);
  ctx.save();
  if (s > 0.5) ctx.translate((noise(t * 97) * 2 - 1) * s, (noise(t * 61 + 3) * 2 - 1) * s);
  if (t < 2.15) scene1(t); else scene2(t);
  ctx.restore();

  // Yellow wipe between the problem and the answer.
  const p = easeInOut(seg(t, 2.0, 2.3));
  if (p > 0 && p < 1) {
    const L = -3100 + p * 4700, Rr = L + 2600;
    ctx.fillStyle = C.yellow;
    ctx.beginPath();
    ctx.moveTo(L + 500, 0);
    ctx.lineTo(Rr + 500, 0);
    ctx.lineTo(Rr, H);
    ctx.lineTo(L, H);
    ctx.closePath();
    ctx.fill();
  }
}

window.render = render;
window.ready = Promise.all([
  document.fonts.load('800 100px Unbounded', 'ХОСТИНГ 24/7 VPN'),
  document.fonts.load('700 50px Manrope', 'Дёшево ПК'),
  document.fonts.load('700 40px "JetBrains Mono"', 'bot.py')
]);

if (!hashParts.includes('capture')) {
  window.ready.then(() => {
    const t0 = performance.now();
    (function loop(now) {
      const t = ((now - t0) / 1000) % (T + 1);
      render(Math.min(t, T));
      requestAnimationFrame(loop);
    })(t0);
  });
}
</script>
</body>
